<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Risk Predictor</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="container">

        <header>
            <p class="label">CREDIT RISK MODEL</p>
            <h1>Credit Risk Predictor</h1>
            <p>
                Enter the applicant and loan information to estimate
                the probability of loan default.
            </p>
        </header>

        <form id="loanForm">

            <section class="card">
                <h2>Applicant Information</h2>

                <div class="grid">

                    <div class="field">
                        <label for="person_age">Age</label>
                        <input
                            id="person_age"
                            type="number"
                            name="person_age"
                            min="18"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="person_income">Annual Income</label>
                        <input
                            id="person_income"
                            type="number"
                            name="person_income"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="person_home_ownership">
                            Home Ownership
                        </label>

                        <select
                            id="person_home_ownership"
                            name="person_home_ownership"
                            required
                        >
                            <option value="">Select...</option>
                            <option value="RENT">Rent</option>
                            <option value="OWN">Own</option>
                            <option value="MORTGAGE">Mortgage</option>
                            <option value="OTHER">Other</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="person_emp_length">
                            Employment Length (years)
                        </label>

                        <input
                            id="person_emp_length"
                            type="number"
                            name="person_emp_length"
                            min="0"
                            step="0.1"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="loan_intent">Loan Intent</label>

                        <select
                            id="loan_intent"
                            name="loan_intent"
                            required
                        >
                            <option value="">Select...</option>
                            <option value="PERSONAL">Personal</option>
                            <option value="EDUCATION">Education</option>
                            <option value="MEDICAL">Medical</option>
                            <option value="VENTURE">Venture</option>
                            <option value="HOMEIMPROVEMENT">
                                Home Improvement
                            </option>
                            <option value="DEBTCONSOLIDATION">
                                Debt Consolidation
                            </option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="loan_grade">Loan Grade</label>

                        <select
                            id="loan_grade"
                            name="loan_grade"
                            required
                        >
                            <option value="">Select...</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                            <option value="E">E</option>
                            <option value="F">F</option>
                            <option value="G">G</option>
                        </select>
                    </div>

                </div>
            </section>


            <section class="card">

                <h2>Loan Information</h2>

                <div class="grid">

                    <div class="field">
                        <label for="loan_amnt">Loan Amount</label>

                        <input
                            id="loan_amnt"
                            type="number"
                            name="loan_amnt"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="loan_int_rate">
                            Interest Rate (%)
                        </label>

                        <input
                            id="loan_int_rate"
                            type="number"
                            name="loan_int_rate"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="loan_percent_income">
                            Loan / Income Ratio
                        </label>

                        <input
                            id="loan_percent_income"
                            type="number"
                            name="loan_percent_income"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="cb_person_default_on_file">
                            Previous Default
                        </label>

                        <select
                            id="cb_person_default_on_file"
                            name="cb_person_default_on_file"
                            required
                        >
                            <option value="">Select...</option>
                            <option value="N">No</option>
                            <option value="Y">Yes</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="cb_person_cred_hist_length">
                            Credit History Length (years)
                        </label>

                        <input
                            id="cb_person_cred_hist_length"
                            type="number"
                            name="cb_person_cred_hist_length"
                            min="0"
                            step="1"
                            required
                        >
                    </div>

                </div>

                <button type="submit" id="predictButton">
                    Predict Credit Risk
                </button>

                <p id="errorMessage" class="error hidden"></p>

            </section>

        </form>


        <section id="result" class="card result hidden">

            <p class="label">PREDICTION RESULT</p>

            <h2 id="riskResult">—</h2>

            <div class="probability">

                <div class="result-header">
                    <span>Default Probability</span>
                    <strong id="probabilityText">—</strong>
                </div>

                <div class="progress">
                    <div id="probabilityBar"></div>
                </div>

            </div>

            <div class="details">

                <div>
                    <span>Prediction</span>
                    <strong id="predictionValue">—</strong>
                </div>

                <div>
                    <span>Model Threshold</span>
                    <strong id="thresholdValue">—</strong>
                </div>

            </div>

            <button
                type="button"
                id="resetButton"
                class="secondary"
            >
                New Assessment
            </button>

        </section>

    </div>

    <script src="/script.js"></script>

</body>
</html>
